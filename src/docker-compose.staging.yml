name: blazor-telemetry-staging

services:
  blazor-telemetry:
    image: ${BLAZOR_TELEMETRY_IMAGE:-ghcr.io/appliman/blazor-telemetry:staging}
    container_name: blazor-telemetry-staging
    restart: unless-stopped
    stop_grace_period: 30s
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      TZ: Europe/Paris
      Blazor2fa__AllowedUserLogins__0: ${BLAZOR_TELEMETRY_ADMIN_EMAIL:?Set BLAZOR_TELEMETRY_ADMIN_EMAIL}
      Blazor2fa__SecretKey: ${BLAZOR2FA_SECRET_KEY:?Set BLAZOR2FA_SECRET_KEY}
      BlazorTelemetry__RequireIngestionKey: ${BLAZOR_TELEMETRY_REQUIRE_INGESTION_KEY:-false}
    expose:
      - "8080"
    volumes:
      - ${DATA_PATH:-/var/storeroot/blazor-telemetry/staging}:/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.blazor-telemetry-staging-http.rule=Host(`${DOMAIN:?Set DOMAIN without protocol or path}`)"
      - "traefik.http.routers.blazor-telemetry-staging-http.entrypoints=web"
      - "traefik.http.routers.blazor-telemetry-staging-http.middlewares=blazor-telemetry-staging-redirect@docker"
      - "traefik.http.routers.blazor-telemetry-staging.rule=Host(`${DOMAIN:?Set DOMAIN without protocol or path}`)"
      - "traefik.http.routers.blazor-telemetry-staging.entrypoints=websecure"
      - "traefik.http.routers.blazor-telemetry-staging.tls=true"
      - "traefik.http.routers.blazor-telemetry-staging.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.blazor-telemetry-staging.service=blazor-telemetry-staging"
      - "traefik.http.middlewares.blazor-telemetry-staging-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.blazor-telemetry-staging-redirect.redirectscheme.permanent=true"
      - "traefik.http.services.blazor-telemetry-staging.loadbalancer.server.port=8080"
      - "traefik.http.services.blazor-telemetry-staging.loadbalancer.passhostheader=true"
      - "traefik.http.services.blazor-telemetry-staging.loadbalancer.healthcheck.path=/health/live"
      - "traefik.http.services.blazor-telemetry-staging.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.blazor-telemetry-staging.loadbalancer.healthcheck.timeout=5s"

networks:
  traefik:
    external: true
    name: traefik-public
