name: blazor-telemetry-dev

services:
  blazor-telemetry:
    image: blazor-telemetry:dev
    build:
      context: .
      dockerfile: BlazorTelemetry.Host/Dockerfile
      target: final
    container_name: blazor-telemetry-dev
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_RUNNING_IN_CONTAINER: "true"
      TZ: Europe/Paris
      Blazor2fa__AllowedUserLogins__0: ${BLAZOR_TELEMETRY_ADMIN_EMAIL:?Set BLAZOR_TELEMETRY_ADMIN_EMAIL}
      Blazor2fa__SecretKey: ${BLAZOR2FA_SECRET_KEY:?Set BLAZOR2FA_SECRET_KEY}
      Blazor2fa__Issuer: ${BLAZOR2FA_ISSUER:-BlazorTelemetry}
      Blazor2fa__ApplicationName: ${BLAZOR2FA_APPLICATION_NAME:-Local Administrator}
      BlazorTelemetry__RequireIngestionKey: ${BLAZOR_TELEMETRY_REQUIRE_INGESTION_KEY:-false}
    volumes:
      - blazor-telemetry-data:/data

volumes:
  blazor-telemetry-data:
    name: blazor-telemetry-dev-data
