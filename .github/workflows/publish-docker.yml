name: Publish production Docker image

on:
  pull_request:
    branches:
      - prod
    types:
      - closed

concurrency:
  group: publish-production-docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish production image
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: appliman/blazor-telemetry
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Check out merged production revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MERGE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/BlazorTelemetry.Host/Dockerfile
          target: final
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.MERGE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.MERGE_SHA }}
          cache-from: type=gha,scope=blazor-telemetry-production
          cache-to: type=gha,mode=max,scope=blazor-telemetry-production
